name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go vet ./...

      - run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.0

      - name: Build packages
        run: VERSION=0.0.${{ github.run_number }} sh packaging/build.sh

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 0.0.${{ github.run_number }}
        run: |
          git tag -f latest
          git push -f origin refs/tags/latest
          title="Latest build ($VERSION)"
          notes="Built from $GITHUB_SHA."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "$title" --notes "$notes"
            gh release upload latest dist/*.tar.gz dist/*.deb dist/*.rpm dist/checksums.txt --clobber
          else
            gh release create latest dist/*.tar.gz dist/*.deb dist/*.rpm dist/checksums.txt --title "$title" --notes "$notes"
          fi
